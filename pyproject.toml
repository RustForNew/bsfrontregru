[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xhttp-setup"
version = "0.6.6"
description = "Two-node TLS frontend and VLESS/XHTTP exit setup wizard"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Repository owner"}]
dependencies = []

[project.scripts]
xhttp-setup = "xhttp_setup.cli:main"

[tool.setuptools]
packages = ["xhttp_setup"]
