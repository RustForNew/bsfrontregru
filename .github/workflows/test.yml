name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q xhttp_setup
      - name: Download pinned Xray for integration tests
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir .ci-xray
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --retry 3 \
            -o .ci-xray/Xray-linux-64.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  .ci-xray/Xray-linux-64.zip' \
            | sha256sum -c -
          unzip -q .ci-xray/Xray-linux-64.zip -d .ci-xray/unpacked
      - name: Unit tests
        env:
          XRAY_TEST_BINARY: ${{ github.workspace }}/.ci-xray/unpacked/xray
        run: python -m unittest discover -s tests -v
      - name: Build zipapp twice
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/build.py
          first="$(sha256sum dist/xhttp-setup-*.pyz | awk '{print $1}')"
          rm -rf dist
          python scripts/build.py
          second="$(sha256sum dist/xhttp-setup-*.pyz | awk '{print $1}')"
          test "$first" = "$second"
          python dist/xhttp-setup-*.pyz --version
          python dist/xhttp-setup-*.pyz --help >/dev/null
